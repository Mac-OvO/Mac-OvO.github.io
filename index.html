<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac-OvO 越狱源</title>
  <style>
    :root {
      --bg: #e9eef5;
      --text: #30415a;
      --muted: #6b7a90;
      --primary: #4f7cff;
      --radius: 22px;
      --shadow-dark: 10px 10px 20px #c9d0da;
      --shadow-light: -10px -10px 20px #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(820px, 100%);
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: var(--shadow-dark), var(--shadow-light);
      padding: 30px;
    }

    .title {
      font-size: clamp(1.6rem, 3.6vw, 2.3rem);
      margin: 0;
      letter-spacing: .5px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.6;
    }

    .grid {
      margin-top: 24px;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .item {
      border-radius: 18px;
      padding: 18px;
      background: var(--bg);
      box-shadow: inset 4px 4px 10px #ced6e0, inset -4px -4px 10px #ffffff;
    }

    .item h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    code {
      display: block;
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: .9rem;
      color: #1d2c47;
      background: var(--bg);
      box-shadow: 5px 5px 12px #cdd5df, -5px -5px 12px #ffffff;
      word-break: break-all;
    }

    .tag {
      display: inline-block;
      margin-right: 8px;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .82rem;
      background: var(--bg);
      box-shadow: 4px 4px 10px #cdd5df, -4px -4px 10px #ffffff;
      color: var(--primary);
      font-weight: 600;
    }

    a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Mac-OvO 自用越狱源</h1>
    <p class="subtitle">拟态（Neumorphism）风格主页，适配 Sileo / Zebra / Cydia。用于托管你自己的 DEB 包。</p>

    <section class="grid">
      <article class="item">
        <h3>源地址</h3>
        <code>https://mac-ovo.github.io/</code>
      </article>

      <article class="item">
        <h3>设备架构支持</h3>
        <span class="tag">arm64</span>
        <span class="tag">arm64e</span>
        <p class="subtitle">在 DEB 的 control 文件里填写对应 Architecture 字段即可。</p>
      </article>

      <article class="item">
        <h3>仓库索引文件</h3>
        <p class="subtitle">已包含 <code>Packages</code> 与 <code>Release</code>，可直接扩展。</p>
      </article>
    </section>
  </main>
</body>
</html>
