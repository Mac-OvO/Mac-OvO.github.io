name: Build Sileo Repo Packages

on:
  push:
    paths:
      - "debs-rootless/**"
      - "debs-roothide/**"
      - ".github/workflows/build-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip bzip2

      - name: Build Packages
        run: |
          rm -f Packages Packages.gz Packages.bz2 Packages-rootless Packages-roothide

          if ls debs-rootless/*.deb >/dev/null 2>&1; then
            dpkg-scanpackages -m debs-rootless /dev/null > Packages-rootless
          else
            touch Packages-rootless
          fi

          if ls debs-roothide/*.deb >/dev/null 2>&1; then
            dpkg-scanpackages -m debs-roothide /dev/null > Packages-roothide
          else
            touch Packages-roothide
          fi

          python3 <<'PY'
          from pathlib import Path

          def force_section(path, section_name):
              p = Path(path)
              text = p.read_text(errors="ignore")
              if not text.strip():
                  return

              blocks = text.strip().split("\n\n")
              new_blocks = []

              for block in blocks:
                  lines = block.splitlines()
                  has_section = False
                  new_lines = []

                  for line in lines:
                      if line.startswith("Section:"):
                          new_lines.append(f"Section: {section_name}")
                          has_section = True
                      else:
                          new_lines.append(line)

                  if not has_section:
                      new_lines.append(f"Section: {section_name}")

                  new_blocks.append("\n".join(new_lines))

              p.write_text("\n\n".join(new_blocks) + "\n")

          force_section("Packages-rootless", "Rootless")
          force_section("Packages-roothide", "RootHide")   # 修改点：roothide → RootHide
          PY

          cat Packages-rootless Packages-roothide > Packages

          gzip -kf Packages
          bzip2 -kf Packages

      - name: Create Release
        run: |
          cat > Release <<'EOF'
          Origin: Mac-OvO
          Label: Mac-OvO
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Sections: RootHide Rootless          # 新增：声明两个分类
          Description: Mac-OvO Sileo Repository
          EOF

      - name: Create index.html
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Mac-OvO Sileo Repo</title>
          </head>
          <body>
            <h1>Mac-OvO Sileo Repo</h1>
            <p>Add this repo to Sileo:</p>
            <pre>https://Mac-OvO.github.io/</pre>
          </body>
          </html>
          EOF

      - name: Commit Packages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Packages Packages.gz Packages.bz2 Release index.html
          git commit -m "Update Sileo Packages" || echo "No changes"
          git push