name: Build Sileo Repo Packages

on:
  push:
    paths:
      - "debs-rootless/**"
      - "debs-roothide/**"
      - ".github/workflows/build-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip bzip2

      - name: Build Packages
        run: |
          rm -f Packages Packages.gz Packages.bz2 Packages-rootless Packages-roothide

          if ls debs-rootless/*.deb >/dev/null 2>&1; then
            dpkg-scanpackages -m debs-rootless /dev/null > Packages-rootless
            sed -i 's/^Section: .*/Section: Rootless/' Packages-rootless
          else
            touch Packages-rootless
          fi

          if ls debs-roothide/*.deb >/dev/null 2>&1; then
            dpkg-scanpackages -m debs-roothide /dev/null > Packages-roothide
            sed -i 's/^Section: .*/Section: rootHide/' Packages-roothide
          else
            touch Packages-roothide
          fi

          cat Packages-rootless Packages-roothide > Packages

          gzip -kf Packages
          bzip2 -kf Packages

      - name: Create index.html
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Mac-OvO Sileo Repo</title>
          </head>
          <body>
            <h1>Mac-OvO Sileo Repo</h1>
            <p>Add this repo to Sileo:</p>
            <pre>https://Mac-OvO.github.io/</pre>
          </body>
          </html>
          EOF

      - name: Commit Packages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Packages Packages.gz Packages.bz2 index.html
          git commit -m "Update Sileo Packages" || echo "No changes"
          git push